name: Deploy to Dev Environment

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        path: temp-backend
    
    - name: Stop existing backend container
      run: |
        cd /home/administrador/projectCPCEER
        docker compose stop backend || true
        docker compose rm -f backend || true
    
    - name: Update backend code
      run: |
        # Remove old backend code
        rm -rf /home/administrador/projectCPCEER/backend/*
        
        # Copy new code
        cp -r temp-backend/* /home/administrador/projectCPCEER/backend/
    
    - name: Build and start backend
      run: |
        cd /home/administrador/projectCPCEER
        docker compose up -d --build backend
    
    - name: Clean up
      run: rm -rf temp-backend
name: Deploy to Dev Environment

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        path: temp-frontend
    
    - name: Stop existing frontend container
      run: |
        cd /home/administrador/projectCPCEER
        docker-compose stop frontend || true
        docker-compose rm -f frontend || true
    
    - name: Update frontend code
      run: |
        # Remove old frontend code
        rm -rf /home/administrador/projectCPCEER/frontend/*
        
        # Copy new code
        cp -r temp-frontend/* /home/administrador/projectCPCEER/frontend/
    
    - name: Build and start frontend
      run: |
        cd /home/administrador/projectCPCEER
        docker-compose up -d --build frontend
    
    - name: Clean up
      run: rm -rf temp-frontend
services:
  backend:
    build: ./backend
    container_name: node_backend
    ports:
      - "4000:4000"
    env_file:
      - ./.env_back
    restart: unless-stopped
    depends_on:
      - postgres
    command: ["sh", "./start.sh"]

  frontend:
    build: ./frontend
    container_name: node_frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env_front
    restart: unless-stopped
    
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=usrOdin
      - POSTGRES_PASSWORD=0d1n2020**
      - POSTGRES_DB=cpsdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres-data:
